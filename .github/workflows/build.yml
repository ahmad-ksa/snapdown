name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APKs
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          cd app/build/outputs/apk/release
          cp app-arm64-v8a-release.apk   ../../../../../out/SnapDown-arm64.apk
          cp app-armeabi-v7a-release.apk ../../../../../out/SnapDown-armv7.apk
          cp app-universal-release.apk   ../../../../../out/SnapDown-universal.apk
          ls -la ../../../../../out

      - uses: actions/upload-artifact@v4
        with:
          name: SnapDown
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SnapDown 1.0.${{ github.run_number }}
          files: out/*.apk
